<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .subscriber-button {
            background-color: aquamarine;
            color: black;
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 200px;
            padding: 200px;
            font-weight: bold;
        }

        .join-button {
            background-color: indianred;
            border-color: black;
            border: width 1px;
            border-style: solid;
            color: ghostwhite;
            border-radius: 8px;
            cursor: pointer;
        }

        .Tweet-button {
            background-color: darkcyan;
            color: black;
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 30px;
            cursor: pointer;
            margin-right: 8px
        }
    </style>


</head>

<body>
    <button class="subscriber-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="Tweet-button">Tweet</button>
</body>

</html>
