<html>

<head>
    <title>Nike</title>

    <style>
        .back-to-amazon {
            color: rgb(0, 113, 133);
        }

        .back-to-amazon:hover {
            color: brown;
        }


        .stock {
            color: rgb(0, 118, 0);
        }

        .Cart {
            background-color: rgb(255, 216, 20);
            color: black;
            height: 30px;
            width: 120px;
            border: none;
            border-radius: 18px;
            cursor: pointer;

        }

        .Cart:active {
            background-color: rgb(176, 149, 16);
        }

        .Buy {
            background-color: rgb(255, 164, 28);
            color: black;
            height: 30px;
            width: 120px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
        }

        .Buy:active {
            background-color: rgb(168, 109, 21);
        }
    </style>

</head>

<body>
    <a href="https://www.Amazon.com/" class="back-to-amazon">Back to Amazon</a>
    <h1>Nike Black Running Shoes</h1>
    <p class="stock"><b>$39 - in stock.</b></p>
    <p>Free delivery tomorrow.</p>
    <button class="Cart">Add to Cart</button>
    <button class="Buy">Buy now</button>
</body>

</html>
