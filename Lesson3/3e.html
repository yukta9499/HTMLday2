<html>

<head>
    <title>Linkedin</title>

    <style>

            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .Apply:hover {
            background-color: rgb(57, 128, 200)
        }

        .Save {

        }

        }

</head>

<body>
    <button class="Apply">Apply on company website</button>
    <button class="Save">Save</button>
</body>

</html>
