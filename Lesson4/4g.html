<html>

<head>
    <title>Buttons</title>

    <style>
        .Subscribe {
            background-color: rgb(255, 0, 0);
            color: rgb(255, 255, 255);
            height: 50px;
            width: 120px;
            border: none;
            cursor: pointer;
        }


        .Join {
            background-color: white;
            color: rgb(10, 102, 194);
            height: 50px;
            width: 80px;
            border-color: blue;
            cursor: pointer;
        }



        .Tweet {
            background-color: blue;
            color: white;
            padding-top: 17px;
            padding-bottom: 17px;
            padding-left: 30px;
            padding-right: 30px;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="Subscribe">Subscribe</button>
    <button class="Join">Join</button>
    <button class="Tweet">Tweet</button>
</body>

</html>
