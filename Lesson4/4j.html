<html>

<head>
    <title>Shadow</title>

    <style>
        .Shadow {
            background-color: green;
            color: rgb(255, 255, 255);
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 10px;
            padding-bottom: 10px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.6);


        }

        .Shadow:active {
            margin-left: 20px;
            margin-top: 30px;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <button class="Shadow">Shadow</button>

</body>

</html>
